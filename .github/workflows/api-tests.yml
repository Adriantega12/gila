name: API Automated Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test-matrix:
        name: Run Tests (${{ matrix.env }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                env: [dev, prod]

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Start API Service via Docker
              run: docker run -p 3000:3000 ghcr.io/danielsilva-loanpro/sdet-interview-challenge

            - name: Run Pytest against ${{ matrix.env }}
              env:
                  BASE_URL: "http://localhost:3000"
                  ENV_PREFIX: ${{ matrix.env }}
              run: |
                  pytest --env=${{ matrix.env }} --junitxml=reports/junit-${{ matrix.env }}.xml

            - name: Archive Test Logs and Reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-${{ matrix.env }}
                  path: |
                      logs/
                      reports/
                  retention-days: 7

            - name: Dump Docker Logs on Failure
              if: failure()
              run: |
                  docker compose logs
